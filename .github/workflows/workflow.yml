name: CI workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    container: node:20-alpine

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Node.js and npm
        run: |
          node --version
          npm --version

      - name: Verify project files
        run: |
          ls -la
